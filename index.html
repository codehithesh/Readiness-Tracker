<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Readiness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3;--card:#FFFFFF;--ink:#16262B;--mute:#5B6E73;--line:#D6DEDC;
  --accent:#0E7C6B;--accent-ink:#FFFFFF;--warn:#B7791F;--low:#B4463A;--band:rgba(14,124,107,.13);
  --disp:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1719;--card:#172226;--ink:#E4EDEE;--mute:#92A6AB;--line:#26373C;
    --accent:#3FC5AE;--accent-ink:#06201B;--warn:#E2A94B;--low:#E57B6D;--band:rgba(63,197,174,.15);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-top:env(safe-area-inset-top,0px)}
#app{max-width:640px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:16px 2px 6px}
.brand{font:700 22px var(--disp);letter-spacing:-.01em}
#clock{color:var(--mute);font-size:14px}
h3{font:600 17px var(--disp);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.hero{display:flex;gap:14px;align-items:center;margin:6px 0 2px}
.score{display:flex;align-items:baseline;gap:2px;min-width:112px}
.num{font:800 76px/0.9 var(--disp);letter-spacing:-.04em}
.of{color:var(--mute);font-size:15px}
.rtxt{display:flex;flex-direction:column;gap:2px;font-size:15px}
.rtxt b{font:700 20px var(--disp)}
.mute,.note{color:var(--mute);font-size:14px}
.note{margin:6px 0}
.chart{touch-action:pan-y;user-select:none;-webkit-user-select:none;margin:8px -4px 0}
.chart svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line);stroke-width:1}
.thr{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.ax{fill:var(--mute);font-size:10.5px}
.line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.line.fut{stroke-dasharray:2 5}
.line.alt{stroke:var(--warn);stroke-width:1.5;opacity:.8}
.nowline{stroke:var(--ink);stroke-width:1;opacity:.55}
.insp{stroke:var(--accent);stroke-width:1.5}
.win{fill:var(--band)}
.ev-go{fill:var(--accent)}.ev-mid{fill:var(--warn)}.ev-no{fill:var(--low)}
.feelpt{fill:var(--card);stroke:var(--ink);stroke-width:2}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;cursor:pointer;min-height:42px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.55;cursor:default}
button.ghost{border-color:transparent;color:var(--accent);padding:6px 8px;min-height:0;font-weight:600}
button.x{border:0;color:var(--mute);padding:4px 6px;min-height:0;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:block;margin:10px 0 0;font-size:14px;color:var(--mute)}
label input,label select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
textarea{margin-top:0;resize:vertical;display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 90px}
.row button{flex:0 0 auto}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.feel button{padding:6px 0;font:700 18px var(--disp)}
.cap{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:3px}
ul{list-style:none;padding:0;margin:0}
.li{padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .head{display:flex;gap:10px;align-items:baseline}
.li .t{color:var(--mute);min-width:44px;font-size:14px;font-variant-numeric:tabular-nums}
.li .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.li .sub{margin:2px 0 0 54px;font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.go{background:var(--accent);color:var(--accent-ink)}
.pill.mid{background:var(--warn);color:#1b1200}
.pill.no{background:var(--low);color:#fff}
.banner{background:var(--card);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.verdict{font:700 22px var(--disp);margin:2px 0 6px}
.adj{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.adj label{margin:0}
fieldset{border:1px solid var(--line);border-radius:10px;margin:12px 0 0;padding:4px 12px 12px}
legend{padding:0 6px;font-weight:600;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.chk input{width:20px;height:20px;margin:0;padding:0}
details{margin-top:6px}summary{cursor:pointer;font-weight:600;padding:6px 0}
details li{margin:5px 0;font-size:14px;color:var(--mute)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs>div{display:flex;gap:4px;width:100%;max-width:640px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;font-weight:600;color:var(--mute);min-height:46px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--band)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
progress{width:100%;margin-top:8px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="brand">Readiness</div><div id="clock"></div></header>
  <main>
    <section id="tab-dash" class="tab"></section>
    <section id="tab-log" class="tab" hidden></section>
    <section id="tab-ask" class="tab" hidden></section>
    <section id="tab-setup" class="tab" hidden></section>
  </main>
  <p class="note" style="margin-top:18px">A planning heuristic built on estimated effects. Not a medical tool.</p>
</div>
<nav class="tabs" aria-label="Sections"><div>
  <button data-tab="dash">Dashboard</button>
  <button data-tab="log">Log</button>
  <button data-tab="ask">Ask</button>
  <button data-tab="setup">Setup</button>
</div></nav>
<div id="toast" role="status"></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const gauss=(x,c,s)=>Math.exp(-((x-c)**2)/(2*s*s));
const H=36e5,pad=n=>String(n).padStart(2,'0');
const fmtT=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toTs=(k,hm)=>new Date(k+'T'+hm+':00').getTime();
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- state ---------- */
const KEY='readiness.v2',KKEY='readiness.keys.v2';
const def=()=>({profile:{weightKg:75,unit:'kg',sleepH:7.5,wake:'07:00',bed:'23:00'},
  cycle:null,wakeOv:null,sleepHK:null,log:[],feels:[],cal:{items:[],at:0,names:''},rated:{},tried:{},ask:null,calib:{on:false,offset:0},
  ai:{active:'openai',remember:false,openai:{base:'https://api.openai.com/v1',model:'gpt-4o-mini'},deepseek:{base:'https://api.deepseek.com',model:'deepseek-chat'}}});
let S=(()=>{const d=def();try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r){const a=r.ai||{};
  return {...d,...r,profile:{...d.profile,...r.profile},cal:{...d.cal,...r.cal},calib:{...d.calib,...r.calib},ai:{...d.ai,...a,openai:{...d.ai.openai,...a.openai},deepseek:{...d.ai.deepseek,...a.deepseek}}};}}catch(e){}return d;})();
let keys={openai:'',deepseek:''};
try{if(S.ai.remember){const k=JSON.parse(localStorage.getItem(KKEY)||'null');if(k)keys={...keys,...k};}}catch(e){}
const save=()=>{try{S.feels=S.feels.filter(f=>f.ts>Date.now()-14*864e5);S.cal.items=S.cal.items.filter(i=>i.end>Date.now()-2*864e5);
  localStorage.setItem(KEY,JSON.stringify(S));
  if(S.ai.remember)localStorage.setItem(KKEY,JSON.stringify(keys));else localStorage.removeItem(KKEY);}catch(e){}};
const hasKey=()=>!!keys[S.ai.active];
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200);}

/* ---------- ==MODEL START== ---------- */
function sleepInfo(){let h=S.sleepHK?S.sleepHK.hours:S.profile.sleepH,q=3;
  for(const l of S.log){if(l.sleep){if(l.sleep.hours!=null)h=l.sleep.hours;if(l.sleep.quality!=null)q=l.sleep.quality;}}return {h,q};}
function context(now=Date.now()){
  const pr=S.profile;
  let B=toTs(dayKey(new Date(now)),pr.bed);if(B>now)B-=864e5;
  let W=toTs(dayKey(new Date(B)),pr.wake);if(W<=B)W+=864e5;
  if(S.wakeOv&&S.wakeOv>B)W=S.wakeOv;
  let bed=toTs(dayKey(new Date(W)),pr.bed);if(bed<=W+4*H)bed+=864e5;
  const sl=sleepInfo(),wd=new Date(W);
  return {B,wake:W,bed,sleeping:now<W,sleepH:sl.h,sleepQ:sl.q,wakeHour:wd.getHours()+wd.getMinutes()/60};
}
const BASE=c=>{const s=Math.min(c.sleepH/8,1);return 100*(0.35+0.65*s)*Math.min(1,0.88+0.03*c.sleepQ);};
const sugarFx=dt=>6*Math.exp(-dt/0.4)-5*(1-Math.exp(-dt/0.4))*Math.exp(-dt/1.5);
function mealFx(k,dt){
  if(k==='light')return 4*Math.exp(-dt/3);
  if(k==='balanced')return 6*Math.exp(-dt/3.5)-2*gauss(dt,1,0.6);
  if(k==='heavy')return 4*Math.exp(-dt/3)-8*gauss(dt,1.1,0.7);
  return sugarFx(dt);
}
function recFx(e,dt){
  switch(e.kind){
    case 'breath':return 3*Math.exp(-dt/1);
    case 'walk':return 5*Math.exp(-dt/1.5);
    case 'daylight':return 4*Math.exp(-dt/2);
    case 'water':return 2*Math.exp(-dt/1.5);
    case 'nap':return e.min<=30?10*Math.exp(-dt/3):8*Math.exp(-dt/4)-8*Math.exp(-dt/0.5);
  }
  return 0;
}
const caffAt=(t,evs)=>{let L=0;for(const e of evs){if(e.type!=='caffeine'||e.ts>t)continue;const dt=(t-e.ts)/H;L+=e.mg*(1-Math.exp(-4.6*dt))*Math.exp(-0.1386*dt);}return L;};
function model(t,evs,c){
  const h=Math.max(0,(t-c.wake)/H),ws=new Date(c.wake);ws.setHours(0,0,0,0);
  const tod=(t-ws.getTime())/H,sh=(c.wakeHour-7)*0.8;
  const rate=2.6+Math.max(0,8-c.sleepH)*0.12;
  let r=BASE(c)-rate*h-12*Math.exp(-h/0.5)*(c.sleepH<7?1.2:1)
    +6*gauss(tod,10.5+sh,2.5)+5*gauss(tod,18.5+sh,1.8)-9*gauss(tod,14.5+sh,1.3)
    -Math.max(0,tod-(22+sh))*2.5;
  let lastMeal=c.wake;
  for(const e of evs){
    if(e.ts>t)continue;const dt=(t-e.ts)/H;
    switch(e.type){
      case 'activity':{const hr=e.min/60,load=Math.max(0,(e.met-1)*hr);
        r-=Math.min(30,1.5*load)*(0.55+0.45*Math.exp(-dt/5));
        if(e.met>=2.5&&e.met<=7)r+=6*Math.min(hr,1)*Math.exp(-dt/2);break;}
      case 'mental':{const k=0.5+0.2*(e.m||3);r-=Math.min(25,3.5*k*e.min/60)*(0.6+0.4*Math.exp(-dt/3));break;}
      case 'meal':lastMeal=Math.max(lastMeal,e.ts);r+=mealFx(e.kind,dt);break;
      case 'caffeine':if(e.sugar)r+=sugarFx(dt);break;
      case 'recover':r+=recFx(e,dt);break;
    }
  }
  const gap=(t-lastMeal)/H;if(gap>4.5)r-=Math.min(7,(gap-4.5)*2.2);
  const L=caffAt(t,evs),r0=r,f=0.45*(1-Math.exp(-L/75));
  r=r0+f*Math.max(0,92-r0);
  const off=S.calib.on?S.calib.offset:0;
  return {r:clamp(r+off),r0:clamp(r0+off),L};
}
/* ---------- ==MODEL END== ---------- */

/* ---------- ==PARSERS START== ---------- */
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
function ruleRate(title,min,att){
  const t=String(title).toLowerCase();let m=3,p=1;
  if(/lunch|coffee|break|commute|travel|drive|flight|social|happy hour|birthday|dinner|breakfast/.test(t))m=1;
  else if(/stand-?up|sync|check-?in|1:1|one.on.one|catch.?up|office hours|team meeting/.test(t))m=2;
  if(/review|planning|strategy|workshop|deep work|focus|writing|write|report|study|design|analysis|budget|quarterly|retro|demo|code|coding|proposal/.test(t))m=4;
  if(/exam|presentation|pitch|interview|board|negotiat|deadline|keynote|defen[cs]e|launch/.test(t))m=5;
  if(att>=8)m=Math.min(5,m+1);
  if(min>=120&&m>=3)m=Math.min(5,m+1);
  if(/yoga|stretch|walk/.test(t)){p=2;m=Math.min(m,2);}
  if(/gym|run|workout|hike|swim|training|bike|cycling|tennis|football|soccer|basketball|climb|crossfit|pilates|lift|match/.test(t)){p=4;m=Math.min(m,2);}
  return {mental:m,physical:p,src:'rule'};
}
const rating=it=>S.rated[norm(it.title)]||ruleRate(it.title,(it.end-it.start)/6e4,it.att||0);
const tsFromTime=hm=>{let ts=toTs(dayKey(),hm);if(ts>Date.now()+12e4)ts-=864e5;return ts;};
function findTime(s,evening){
  const m=/(?:\bat\s*|@\s*)(\d{1,2})(?::(\d\d))?\s*(am|pm)?\b/.exec(s)||/\b(\d{1,2}):(\d\d)\s*(am|pm)?/.exec(s)||/\b(\d{1,2})\s*(am|pm)\b/.exec(s);
  if(!m)return null;let h=+m[1];const mi=+(m[2]&&/^\d\d$/.test(m[2])?m[2]:0),ap=m[3]||(/^(am|pm)$/.test(m[2]||'')?m[2]:null);
  if(h>24||mi>59)return null;
  if(ap==='pm'&&h<12)h+=12;else if(ap==='am'&&h===12)h=0;else if(!ap&&((evening&&h<=10)||(h>=1&&h<=6)))h+=12;
  return pad(h%24)+':'+pad(mi);
}
function findMinutes(s){const m=/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)\b/.exec(s);if(!m)return null;
  const v=+m[1];return /^h/.test(m[2])?Math.round(v*60):Math.round(v);}
function localParse(text){
  const out={events:[],sleep:null,note:'Parsed with the simple built-in parser.'};
  const clauses=text.split(/[,;\n]|\band\b|\bthen\b/i).map(x=>x.trim()).filter(Boolean);
  for(const cl of clauses){
    const s=cl.toLowerCase(),mSl=/slept\s+(?:for\s+)?(\d+(?:\.\d+)?)/.exec(s);
    if(mSl||/\bslept\b|bad sleep|poor sleep|good sleep/.test(s)){
      out.sleep=out.sleep||{};if(mSl)out.sleep.hours=clamp(+mSl[1],0,14);
      if(/badly|poorly|bad sleep|poor sleep|restless/.test(s))out.sleep.quality=2;
      if(/\bwell\b|great|good sleep/.test(s))out.sleep.quality=4;continue;}
    const evening=/dinner|supper|tonight|evening/.test(s),tm=findTime(s,evening),mins=findMinutes(s);
    const base={time:tm};let e=null;
    if(/energy drink|red bull|monster/.test(s))e={type:'caffeine',name:'Energy drink',mg:160,sugar:true,kcal:110};
    else if(/espresso/.test(s))e={type:'caffeine',name:'Espresso',mg:63,kcal:5};
    else if(/coffee|latte|cappuccino|americano/.test(s))e={type:'caffeine',name:'Coffee',mg:95,kcal:5};
    else if(/green tea/.test(s))e={type:'caffeine',name:'Green tea',mg:28,kcal:2};
    else if(/\btea\b/.test(s))e={type:'caffeine',name:'Tea',mg:47,kcal:2};
    else if(/cola|coke|pepsi/.test(s))e={type:'caffeine',name:'Cola',mg:34,sugar:true,kcal:140};
    else if(/yoga/.test(s))e={type:'activity',name:'Yoga',met:2.5,min:mins||30};
    else if(/stretch/.test(s))e={type:'activity',name:'Stretching',met:2.3,min:mins||15};
    else if(/hiit|circuit/.test(s))e={type:'activity',name:'HIIT',met:8,min:mins||30};
    else if(/\brun|running|jog/.test(s))e={type:'activity',name:'Run',met:/jog/.test(s)?7:9.8,min:mins||30};
    else if(/gym|lift|weights|strength/.test(s))e={type:'activity',name:'Strength training',met:5,min:mins||45};
    else if(/cycl|bike|biking/.test(s))e={type:'activity',name:'Cycling',met:7.5,min:mins||40};
    else if(/swim/.test(s))e={type:'activity',name:'Swimming',met:5.8,min:mins||30};
    else if(/hike|hiking/.test(s))e={type:'activity',name:'Hike',met:6,min:mins||60};
    else if(/dance|dancing/.test(s))e={type:'activity',name:'Dancing',met:5,min:mins||30};
    else if(/\bwalk/.test(s))e={type:'activity',name:'Walk',met:3.5,min:mins||20};
    else if(/\bnap\b/.test(s))e={type:'recover',kind:'nap',min:mins||20};
    else if(/water/.test(s))e={type:'recover',kind:'water'};
    else if(/breath|meditat/.test(s))e={type:'recover',kind:'breath'};
    else if(/daylight|sunlight|outside/.test(s))e={type:'recover',kind:'daylight'};
    else if(/candy|soda|dessert|cake|ice cream|chocolate|sweet/.test(s))e={type:'meal',kind:'sugary'};
    else if(/pizza|burger|buffet|heavy/.test(s))e={type:'meal',kind:'heavy'};
    else if(/snack|fruit|biscuit|nuts/.test(s))e={type:'meal',kind:'light'};
    else if(/breakfast|lunch|dinner|supper|meal|ate\b/.test(s))e={type:'meal',kind:'balanced'};
    else if(/work|study|focus|writing|coding|report|exam|meeting|call/.test(s))e={type:'mental',name:cl.slice(0,40),min:mins||60,m:/deep|exam|hard/.test(s)?5:3};
    if(e)out.events.push({...e,...base});
  }
  return out;
}
function sanitize(raw){
  const out=[],n=(x,a,b,d)=>{x=+x;return isFinite(x)?clamp(x,a,b):d;};
  for(const e of Array.isArray(raw)?raw:[]){
    if(!e||typeof e!=='object')continue;
    const tm=typeof e.time==='string'&&/^\d{1,2}:\d\d$/.test(e.time)?e.time.padStart(5,'0'):null;
    const ts=tm?tsFromTime(tm):Date.now(),name=String(e.name||'').slice(0,40);
    const kc=+e.kcal>0?{kcal:n(e.kcal,0,3000,0)}:{};
    switch(e.type){
      case 'activity':out.push({type:'activity',ts,name:name||'Activity',met:n(e.met,1.5,16,4),min:n(e.minutes,1,600,30),...kc});break;
      case 'caffeine':out.push({type:'caffeine',ts,name:name||'Caffeine',mg:n(e.mg,0,600,95),sugar:!!e.sugar,...kc});break;
      case 'meal':out.push({type:'meal',ts,kind:['light','balanced','heavy','sugary'].includes(e.kind)?e.kind:'balanced',...kc});break;
      case 'mental':out.push({type:'mental',ts,name:name||'Mental work',min:n(e.minutes,5,720,60),m:Math.round(n(e.demand,1,5,3))});break;

/* ---------- Apple Health ---------- */
const HKMET={Running:9.8,Walking:3.5,Cycling:7.5,Swimming:5.8,Yoga:2.5,HighIntensityIntervalTraining:8,TraditionalStrengthTraining:5,FunctionalStrengthTraining:5,Hiking:6,Elliptical:5,Rowing:7,Dance:5,CoreTraining:4,Pilates:3,Basketball:6.5};
const hkDate=s=>{const m=/(\d{4}-\d\d-\d\d) (\d\d:\d\d:\d\d) ([+-]\d\d)(\d\d)/.exec(s||'');return m?new Date(`${m[1]}T${m[2]}${m[3]}:${m[4]}`).getTime():NaN;};
const attr=(s,n)=>{const m=new RegExp('\\b'+n+'="([^"]*)"').exec(s);return m?m[1]:null;};
async function parseHealth(file,prog){
  const cut=dayKey(new Date(Date.now()-3*864e5)),rd=file.stream().getReader(),dec=new TextDecoder();
  let buf='',read=0,wt=null;const sl=[],wk=[];
  const re=/<Record type="HKCategoryTypeIdentifierSleepAnalysis"[^>]*>|<Record type="HKQuantityTypeIdentifierBodyMass"[^>]*>|<Workout [^>]*>/g;
  const scan=txt=>{re.lastIndex=0;let m;while((m=re.exec(txt))){const tag=m[0],end=attr(tag,'endDate');if(!end)continue;const a=hkDate(attr(tag,'startDate')),b=hkDate(end);
    if(tag.includes('BodyMass')){let v=parseFloat(attr(tag,'value'));if(attr(tag,'unit')==='lb')v/=2.20462;if(v>0&&(!wt||b>wt.t))wt={kg:v,t:b};continue;}
    if(end.slice(0,10)<cut)continue;
    if(tag.startsWith('<Record')){if(!/Asleep/.test(attr(tag,'value')||''))continue;if(b>a)sl.push([a,b]);}
    else{const typ=(attr(tag,'workoutActivityType')||'Other').replace('HKWorkoutActivityType','');let min=parseFloat(attr(tag,'duration')||'0');
      const du=attr(tag,'durationUnit');if(du==='sec')min/=60;else if(du==='hr')min*=60;const kc=parseFloat(attr(tag,'totalEnergyBurned')||'');
      wk.push({start:a,end:b,name:typ.replace(/([A-Z])/g,' $1').trim(),min:min||(b-a)/6e4,met:HKMET[typ]||4,kcal:isNaN(kc)?null:kc});}}};
  for(;;){const {done,value}=await rd.read();if(done)break;read+=value.length;buf+=dec.decode(value,{stream:true});
    const i=buf.lastIndexOf('>');if(i<0)continue;scan(buf.slice(0,i+1));buf=buf.slice(i+1);prog(read/file.size);await new Promise(r=>setTimeout(r));}
  scan(buf);sl.sort((x,y)=>x[0]-y[0]);const ses=[];
  for(const [a,b] of sl){const L=ses[ses.length-1];if(L&&a<=L.end+60*6e4){L.end=Math.max(L.end,b);L.iv.push([a,b]);}else ses.push({start:a,end:b,iv:[[a,b]]});}
  for(const s of ses){let tot=0,cs=-1,ce=-1;for(const [a,b] of s.iv){if(a>ce){if(ce>cs)tot+=ce-cs;cs=a;ce=b;}else ce=Math.max(ce,b);}if(ce>cs)tot+=ce-cs;s.hours=tot/H;}
  const recent=ses.filter(s=>s.end>Date.now()-36*H),sleep=recent.filter(s=>s.hours>=3).pop()||recent.pop()||null;
  const t0=new Date();t0.setHours(0,0,0,0);const seen=new Set();
  return {sleep,weight:wt,workouts:wk.filter(x=>x.end>=t0.getTime()&&!seen.has(x.start)&&seen.add(x.start))};
}

      all=[...new Map(all.map(i=>[i.id,i])).values()].sort((a,b)=>a.start-b.start).map(i=>({...i,skip:!!skipMap[i.id]}));
      S.cal={items:all,at:Date.now(),names:[...t.files].map(f=>f.name).join(', ')};save();
      out.textContent=all.length?`${all.length} events in the next 7 days loaded.`:'No timed events found in the next 7 days. All-day events are ignored.';
      rateCalendarAI();}
    catch(e){out.textContent='Could not read that file. Pick a .ics file.';}
  }
  if(t.id==='hkfile'&&t.files[0]){
    const pr=$('#hkprog'),out=$('#hkout');pr.hidden=false;pr.value=0;out.textContent='Reading...';
    try{hk=await parseHealth(t.files[0],v=>pr.value=v);pr.hidden=true;const s=hk.sleep,wk=hk.workouts;
      out.innerHTML=`<p>${s?`Sleep: <b>${s.hours.toFixed(1)} h</b>, ${fmtT(s.start)} to ${fmtT(s.end)}.`:'No recent sleep found.'}<br>${wk.length?'Workouts today: '+wk.map(x=>esc(x.name)+' '+Math.round(x.min)+' min').join(', ')+'.':'No workouts today.'}<br>${hk.weight?`Weight: ${hk.weight.kg.toFixed(1)} kg.`:'No weight found.'}</p>${s||wk.length||hk.weight?'<button class="primary" data-act="applyhk">Use this data</button>':''}`;}
    catch(e){pr.hidden=true;out.textContent='Could not read that file. Pick export.xml from the unzipped folder.';}
  }
});
$$('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
window.addEventListener('resize',()=>{if(tab==='dash')drawChart(world());});
const tick=()=>{syncCycle();$('#clock').textContent=new Date().toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+' · '+fmtT(Date.now());
  if(tab==='dash'&&$('#chart')){const w=world();renderReadout(w);drawChart(w);}};
setInterval(tick,60000);tick();setTab('dash');rateCalendarAI();
})();
</script>
